name: tests

# 此工作流只負責「驗證」，不會影響 GitHub Pages 靜態網頁部署。
# 任一 push / pull request 都會以 Node 內建測試執行 test/ 下的單元測試。
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run node --test
        run: node --test test/*.test.js
