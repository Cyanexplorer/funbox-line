<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Funbox / 來玩聚 LINE 官方帳號一鍵抽獎</title>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

    <!-- 頂部頁面切換分頁 -->
    <div class="page-tabs">
        <button class="page-tab active" onclick="App.showPage('draws', this)">抽獎連結</button>
        <button class="page-tab" onclick="App.showPage('stores', this)">加門市好友</button>
    </div>

    <!-- 加門市好友區塊 -->
    <h1 id="stores-title" style="display:none;">LINE 門市帳號一鍵快速加好友</h1>
    <p class="subtitle" id="stores-subtitle" style="display:none;">可直接依縣市篩選門市；點擊右側按鈕會開啟 LINE App 加好友（已點過會自動變灰色）</p>
    <div class="filter-btn-group" id="storeFilterBtnGroup" style="display:none;"></div>
    <div class="grid" id="storeGrid" style="display:none;"></div>

    <!-- 抽獎連結區塊 -->
    <div id="page-draws">
        <h1 class="draw-main-title">Funbox / 來玩聚 門市抽獎活動</h1>
        
        <div class="continuous-draw-guide">
            <strong>連續抽選模式操作方式</strong>
            1. 點擊清單項目旁的 ⭐ 可標記最愛，並選擇下方抽選模式（「🌟 優先抽我的最愛」、「🎯 只抽我的最愛」或「📋 全部依序」）。<br/>
            2. 亦可點擊下方「地區篩選」或輸入關鍵字聚焦特定縣市門市。<br/>
            3. 按「開啟抽選」先抽第一個，抽完後只要按「完成並開啟下一個」即可持續抽選！
        </div>

        <!-- 連續抽選面板 -->
        <div class="continuous-draw-panel" id="continuousDrawPanel">
            <div class="continuous-draw-title">
                <span>⚡ 連續抽選模式</span>
            </div>

            <!-- 模式選擇按鈕列 -->
            <div class="draw-mode-selector">
                <button type="button" class="draw-mode-btn mode-fav active" data-mode="fav-first" title="先抽有加星 ⭐ 的最愛項目，抽完後接續抽其餘項目">🌟 優先抽我的最愛</button>
                <button type="button" class="draw-mode-btn mode-fav" data-mode="fav-only" title="僅抽選有加星 ⭐ 的最愛項目">🎯 只抽我的最愛</button>
                <button type="button" class="draw-mode-btn" data-mode="all" title="按照門市原本順序依序抽選">📋 全部依序</button>
            </div>

            <div class="continuous-draw-progress" id="continuousDrawProgress">載入中...</div>
            <div class="continuous-draw-store" id="continuousDrawStore"></div>
            <div class="continuous-draw-product" id="continuousDrawProduct"></div>

            <div class="continuous-draw-actions">
                <button class="continuous-draw-open" id="continuousDrawOpen">開啟抽選</button>
                <button class="continuous-draw-next" id="continuousDrawNext">完成並開啟下一個</button>
                <button class="continuous-draw-skip" id="continuousDrawSkip">略過此項目</button>
            </div>
        </div>

        <!-- 綜合篩選控制箱 (搜尋 + 地區篩選) -->
        <div class="filter-control-box">
            <!-- 搜尋框 -->
            <div class="search-input-wrapper">
                <input type="text" class="search-input" id="drawSearchInput" placeholder="🔍 輸入商品名稱或門市關鍵字快速搜尋 (例: 龍神, 女武神, 台北地下街...)" />
                <button type="button" class="search-clear-btn" id="searchClearBtn" title="清除搜尋">✕</button>
            </div>

            <!-- 地區篩選列 -->
            <div class="filter-row">
                <div class="filter-row-label">📍 地區與最愛篩選：</div>
                <div class="draw-filter-btn-group" id="drawFilterBtnGroup"></div>
            </div>

            <!-- 篩選狀態統計與重設 -->
            <div class="filter-status-bar">
                <div class="filter-status-text" id="filterStatusText">載入篩選中...</div>
                <button type="button" class="btn-reset-filters" onclick="App.resetFilters()">重設所有篩選</button>
            </div>
        </div>

        <!-- 門市與商品抽選清單 -->
        <div class="draw-list" id="drawListContainer"></div>
    </div>

    <!-- 資料與邏輯模組 -->
    <script src="data/stores.js"></script>
    <script src="data/draws.js"></script>
    <script src="js/favorites.js"></script>
    <script src="js/continuous-draw.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
